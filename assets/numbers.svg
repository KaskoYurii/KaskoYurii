<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 236" width="1200" height="236" role="img" aria-label="In numbers: 5+ years from idea to production, 4 teams since 2021, 3 live products, 26 tools in the stack.">
<defs><clipPath id="card"><rect width="1200" height="236" rx="28"/></clipPath></defs>
<style>@font-face{font-family:'Dnumbers';src:url(data:font/woff2;base64,) format('woff2')}.D{font-family:'Dnumbers',Unbounded,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:'Bnumbers';src:url(data:font/woff2;base64,) format('woff2')}.B{font-family:'Bnumbers',Onest,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g clip-path="url(#card)">
<rect width="1200" height="236" fill="#000000"/>
<text x="48.0" y="116.0" class="D" font-size="72" fill="#fff" >5</text>
<text x="110.8" y="116.0" class="D" font-size="72" fill="#9ea4ff" >+</text>
<rect x="48.0" y="140" width="220.0" height="2" fill="#fff" fill-opacity=".12"/>
<rect x="48.0" y="140" width="48" height="2" fill="#9ea4ff"><animate attributeName="x" values="48.0;220.0;48.0" dur="5s" begin="0.0s" repeatCount="indefinite" calcMode="spline" keySplines=".6 0 .4 1;.6 0 .4 1"/></rect>
<text x="48.0" y="174.0" class="B" font-size="17" fill="#a3a6ad" >years taking products from</text>
<text x="48.0" y="198.0" class="B" font-size="17" fill="#a3a6ad" >idea to production</text>
<rect x="300.0" y="40" width="1" height="156" fill="#fff" fill-opacity=".14"/>
<text x="324.0" y="116.0" class="D" font-size="72" fill="#fff" >4</text>
<rect x="324.0" y="140" width="220.0" height="2" fill="#fff" fill-opacity=".12"/>
<rect x="324.0" y="140" width="48" height="2" fill="#9ea4ff"><animate attributeName="x" values="324.0;496.0;324.0" dur="5s" begin="-1.2s" repeatCount="indefinite" calcMode="spline" keySplines=".6 0 .4 1;.6 0 .4 1"/></rect>
<text x="324.0" y="174.0" class="B" font-size="17" fill="#a3a6ad" >teams and clients shipped</text>
<text x="324.0" y="198.0" class="B" font-size="17" fill="#a3a6ad" >with since 2021</text>
<rect x="576.0" y="40" width="1" height="156" fill="#fff" fill-opacity=".14"/>
<text x="600.0" y="116.0" class="D" font-size="72" fill="#fff" >3</text>
<rect x="600.0" y="140" width="220.0" height="2" fill="#fff" fill-opacity=".12"/>
<rect x="600.0" y="140" width="48" height="2" fill="#9ea4ff"><animate attributeName="x" values="600.0;772.0;600.0" dur="5s" begin="-2.4s" repeatCount="indefinite" calcMode="spline" keySplines=".6 0 .4 1;.6 0 .4 1"/></rect>
<text x="600.0" y="174.0" class="B" font-size="17" fill="#a3a6ad" >live products, one I use every</text>
<text x="600.0" y="198.0" class="B" font-size="17" fill="#a3a6ad" >day</text>
<rect x="852.0" y="40" width="1" height="156" fill="#fff" fill-opacity=".14"/>
<text x="876.0" y="116.0" class="D" font-size="72" fill="#fff" >26</text>
<rect x="876.0" y="140" width="220.0" height="2" fill="#fff" fill-opacity=".12"/>
<rect x="876.0" y="140" width="48" height="2" fill="#9ea4ff"><animate attributeName="x" values="876.0;1048.0;876.0" dur="5s" begin="-3.5999999999999996s" repeatCount="indefinite" calcMode="spline" keySplines=".6 0 .4 1;.6 0 .4 1"/></rect>
<text x="876.0" y="174.0" class="B" font-size="17" fill="#a3a6ad" >tools in the stack, AI pair</text>
<text x="876.0" y="198.0" class="B" font-size="17" fill="#a3a6ad" >programmers included</text>
</g>
</svg>
