# Rebuilds the contribution snake daily in the site palette (cobalt #2f3cff). Runs on GitHub, no servers.
name: profile-images

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # snake eating the contribution grid
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#2f3cff&color_dots=#e3e4e8,#c5c9ff,#9ea4ff,#5f69ff,#2f3cff
            assets/snake-dark.svg?palette=github-dark&color_snake=#9ea4ff&color_dots=#161b22,#1c237a,#2f3cff,#5f69ff,#9ea4ff

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "chore: refresh profile images" && git push || echo "no changes"
